  name: Zonos Landed Cost REST API (legacy)
  description: Legacy REST endpoint that returns a complete breakdown of the duties,
    taxes and fees making up a total landed cost for a shipment. Requires a `zonos-version`
    request header. Zonos documents its REST layer as end-of-life with limited access
    to newer features and directs new integrations to the Graph.
