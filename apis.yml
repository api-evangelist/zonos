- aid: zonos:zonos-graph-graphql-api
  name: Zonos Graph (GraphQL API)
  description: The Zonos Graph is the company's supported integration surface — a single
    GraphQL endpoint covering landed cost, classification, country of origin, export
    control, item and party restriction screening, carts and checkout sessions, orders,
    shipments, ratings, labels, cartonization, customs documents and customs specs,
    manifests, consignments and consolidations, CBP entries, postal PDDP submissions,
    store credit and webhooks. Public introspection returned 1,396 types, 170 queries
    and 153 mutations on 2026-07-30 with no credential presented. There is no subscription
    type; asynchronous delivery is by webhook.
