name: Zonos
kind: company
description: Zonos is a cross-border trade technology company headquartered in St. George,
  Utah, United States, that sells customs and trade compliance as an API. Its products
  calculate landed cost (duty, tax, brokerage and carrier fees), classify goods to
  HS codes with AI, screen parties and items against restricted and denied lists,
  rate and label international parcels, generate customs documents, submit postal
  PDDP declarations to destination posts, and file CBP entries for consolidated air
  consignments. It sits in the middle of the chain — between merchants, carriers,
  postal operators and freight consolidators on one side and customs authorities on
  the other — and is one of the few organizations in this tier whose integration surface
  is genuinely public rather than a customer-contract portal. A single unified GraphQL
  endpoint at https://api.zonos.com/graphql answers unauthenticated introspection
  (1,396 types, 170 queries, 153 mutations, harvested 2026-07-30), the reference is
  browsable without login at https://zonos.com/developer, and a legacy REST v1 layer
  remains documented but is declared end-of-life. Calling anything real still requires
  a credential token from the Zonos Dashboard, which is self-serve only for Shopify
  merchants; every other platform is routed through sales and an account agreement.
