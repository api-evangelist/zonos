  name: Zonos Classify REST API (legacy)
  description: Legacy REST endpoints for harmonizing a catalog to HS codes one item
    at a time or in bulk, with a group identifier for retrieving bulk results. Documented
    paths are /v1/classify, /v1/classify/:id, /v1/classify/bulk and /v1/classify/bulk/:group_id.
    Declared end-of-life in favor of the Graph.
