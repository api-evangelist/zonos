aid: zonos
name: Zonos
review:
  question: Does Zonos publish a reachable, standards-legible API surface that the next
    party in a cross-border shipment chain can speak?
  answer: true
  date: '2026-07-30'
  reviewer: API Evangelist
  tier: customs-trade-tech
  cohort: freight-platforms
  homeCountry: United States
  domainVerified: true
  domainNote: |
    zonos.com resolves and is the real primary domain (HTTP 200; www.zonos.com
    301s to the apex). docs.zonos.com 301s to https://zonos.com/docs.
    developer.zonos.com does NOT resolve to a valid certificate (curl error 60,
    SSL certificate problem) — the developer reference lives at the path
    https://zonos.com/developer, not on a subdomain.
findings:
  summary: |
    Zonos is a genuine outlier for this tier. Where most customs and trade-tech
    vendors hide the contract behind a customer login, Zonos publishes a single
    unified GraphQL endpoint at https://api.zonos.com/graphql whose full schema
    answers an unauthenticated introspection query (HTTP 200, 1.96 MB, 1,396
    types, 170 queries, 153 mutations, harvested 2026-07-30). The human-readable
    reference at https://zonos.com/developer is browsable without a login, and
    the company ships a curated https://zonos.com/llms.txt index explicitly
    written for agents.

    The schema itself is where the interoperability evidence lives. It carries
    the WCO Harmonized System as a first-class versioned concept, the US CBP ACE
    CATAIR Partner Government Agency message sets as typed results, UPU postal
    operator codes and the ITMATT declaration status, GS1 GTIN/UPC as an item
    key, and the full EU/UK/rest-of-world tax-ID regime (EORI, IOSS, VOEC, GST,
    VAT, plus 20-odd national forms). What is conspicuously absent is every
    freight-side standard: no DCSA, no IATA ONE Record, no IATA Cargo-XML, no
    GS1 EPCIS, no UN/CEFACT MMT RDM, no eFTI, no UN/LOCODE, and — notably for
    this sector — zero occurrences of EDIFACT or ANSI X12 anywhere in the
    schema. Zonos is customs-and-parcel-shaped, not container-shaped, and it is
    REST/GraphQL-native rather than an EDI house with a REST veneer.

    The contract is proprietary in shape even where the vocabulary is standard.
    A counterparty integrates against the Zonos Graph, not against a standard
    anyone else implements, so this is one integration per Zonos relationship
    rather than a write-once conformant surface.
  publicSurface:
    graphqlIntrospectionPublic: true
    graphqlIntrospectionNote: |
      POST https://api.zonos.com/graphql with a bare {__schema{queryType{name}}}
      and no credentialToken returned HTTP 200. A full IntrospectionQuery
      returned HTTP 200 and 1,959,198 bytes. Saved verbatim to
      graphql/zonos-graphql-schema.json.
    typeCount: 1396
    queryCount: 170
    mutationCount: 153
    subscriptionType: null
